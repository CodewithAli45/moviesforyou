<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoviesForYou - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 400px; }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 2rem;
      background: #1f2937; border-radius: 1.5rem;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; color: #ef4444; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: #9ca3af; margin-bottom: 2rem; line-height: 1.6; }
    button {
      background: white; color: #030712; border: none;
      padding: 0.75rem 2rem; border-radius: 9999px;
      font-weight: 500; font-size: 0.875rem; cursor: pointer;
    }
    button:hover { background: #e5e7eb; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M18.364 5.636a9 9 0 010 12.728m-2.829-2.829a5 5 0 00-7.072 0m7.072 0l-4.243 4.243m0-4.243l4.243 4.243M3 12a9 9 0 1018 0 9 9 0 00-18 0z" />
      </svg>
    </div>
    <h1>You&rsquo;re Offline</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
